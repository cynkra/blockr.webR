# Workflow derived from https://github.com/r-wasm/actions/tree/v1/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    # Only build on main or master branch
    branches: [main, master]
  # Or when triggered manually
  workflow_dispatch: {}

name: Build and deploy wasm R package repository

jobs:
  # Reads `./packages` for package references to put
  # into a CRAN-like repository hosted on GitHub pages
  deploy-cran-repo:
    uses: ./.github/workflows/deploy-cran-repo.yml
    with:
      # Must match the webR version shipped by the consumer (shinylive 0.10.8
      # bundles webR 0.5.5 / R 4.5.0). Building against `:main` produces R 4.6
      # binaries that shinylive cannot find, yielding "no package called X".
      webr-image: "ghcr.io/r-wasm/webr:v0.5.5"
      compress: true
    permissions:
      # To download GitHub Packages within action
      repository-projects: read
      # For publishing to pages environment
      pages: write
      id-token: write